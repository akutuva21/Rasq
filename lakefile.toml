name = "stochastic-quantization"
defaultTargets = ["StochasticQuantization"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "StochasticQuantization"
globs = [
  "StochasticQuantization",
  "StochasticQuantization.Core",
  "StochasticQuantization.BirthDeath",
  "StochasticQuantization.BirthDeathPoisson",
  "StochasticQuantization.Processivity",
  "StochasticQuantization.SlowFast",
  "StochasticQuantization.HistoryFilter",
  "StochasticQuantization.Ras",
  "StochasticQuantization.RasEquilibrium",
  "StochasticQuantization.RasGenerator",
  "StochasticQuantization.RasFastBlock",
  "StochasticQuantization.RasStateSpace",
  "StochasticQuantization.RasBlockPoisson",
  "StochasticQuantization.RasGlobalCorrector",
  "StochasticQuantization.RasGlobalPoisson",
  "StochasticQuantization.RasSlowForward",
  "StochasticQuantization.RasFiniteOperators",
  "StochasticQuantization.FiniteTV",
  "StochasticQuantization.StationaryMixture",
  "StochasticQuantization.RasReversePoisson",
  "StochasticQuantization.RasFullStationary",
  "StochasticQuantization.Theory",
  "StochasticQuantization.Theory.FiniteMetric",
  "StochasticQuantization.Theory.Decoder",
  "StochasticQuantization.Theory.FastSwitching",
  "StochasticQuantization.Theory.DwellDistribution",
  "StochasticQuantization.Theory.Mesoscopic",
  "StochasticQuantization.Theory.CatalyticLumping",
  "StochasticQuantization.Theory.Accessibility",
  "StochasticQuantization.RasTheory"
]
